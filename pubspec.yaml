name: taskerr
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  firebase_auth: any
  firebase_core: 3.10.0
  firebase_storage: 12.4.0
  cached_network_image_ce: ^4.9.0
  image_picker: ^1.2.3
  image_picker_for_web: ^3.1.1
  image_cropper: ^12.2.1
  cloud_firestore: ^5.6.1
  pwa_install: ^0.0.6
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutterfire_cli: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/taskerr_logo_white.png
    - assets/images/taskerr_logo_white_header.png
    - assets/images/blank_profile.png
